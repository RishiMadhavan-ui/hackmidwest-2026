# In-cluster Valkey for grant / idempotency / kill-switch state (C01/C04).
# AOF + PVC preserve consumed grants, revocation and original decisions on restart.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: valkey-state
  namespace: hackmidwest
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey
  namespace: hackmidwest
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: valkey
  template:
    metadata:
      labels:
        app: valkey
    spec:
      containers:
        - name: valkey
          image: valkey/valkey:8-alpine
          args: ["--save", "", "--appendonly", "yes", "--appendfsync", "always", "--dir", "/data"]
          volumeMounts:
            - name: state
              mountPath: /data
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["valkey-cli", "ping"]
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["valkey-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: valkey-state
---
apiVersion: v1
kind: Service
metadata:
  name: valkey
  namespace: hackmidwest
spec:
  type: ClusterIP
  selector:
    app: valkey
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
