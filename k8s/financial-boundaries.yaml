# Same-namespace selectors; enforcement requires the cluster CNI's NetworkPolicy support.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: valkey-trusted-rail-only
  namespace: hackmidwest
spec:
  podSelector:
    matchLabels:
      app: valkey
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: webhook
      ports:
        - protocol: TCP
          port: 6379
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: webhook-trusted-callers
  namespace: hackmidwest
spec:
  podSelector:
    matchLabels:
      app: webhook
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: api
        - podSelector:
            matchLabels:
              app: store
        # Web exposes only /rail/lithic/asa, which requires provider HMAC.
        - podSelector:
            matchLabels:
              app: web
      ports:
        - protocol: TCP
          port: 8000
