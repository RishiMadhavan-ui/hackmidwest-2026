# Simulated Volt Supply Co. merchant. ClusterIP Service `store`; public via
# web rewrite /store/products/* only. Checkout callers stay in-cluster.
# Bound completion charges through the local rail (WEBHOOK_CHARGE_TOKEN).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: store
  namespace: hackmidwest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: store
  template:
    metadata:
      labels:
        app: store
    spec:
      containers:
        - name: store
          image: ${STORE_IMAGE}
          imagePullPolicy: Always
          env:
            - name: STORE_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: app-env
                  key: STORE_API_TOKEN
            - name: STORE_CHARGE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: app-env
                  key: STORE_CHARGE_TOKEN
            - name: MERCHANT_BACKEND_TOKEN
              valueFrom:
                secretKeyRef:
                  name: app-env
                  key: MERCHANT_BACKEND_TOKEN
            - name: ATTACK_LAB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: app-env
                  key: ATTACK_LAB_TOKEN
                  optional: true
            - name: STORE_EVIL_MODE
              valueFrom:
                secretKeyRef:
                  name: app-env
                  key: STORE_EVIL_MODE
                  optional: true
            - name: LEASH_EXECUTION_ENABLED
              valueFrom:
                secretKeyRef:
                  name: app-env
                  key: LEASH_EXECUTION_ENABLED
                  optional: true
            - name: API_URL
              value: http://api:8000
            - name: WEBHOOK_URL
              value: http://webhook:8000
            - name: WEBHOOK_CHARGE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: app-env
                  key: WEBHOOK_CHARGE_TOKEN
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: store
  namespace: hackmidwest
spec:
  type: ClusterIP
  selector:
    app: store
  ports:
    - name: http
      port: 8000
      targetPort: 8000
