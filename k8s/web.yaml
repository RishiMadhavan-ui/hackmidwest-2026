# Next.js frontend. Public traffic lands here; /backend/* is rewritten to the
# api Service inside the cluster.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: hackmidwest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: ${WEB_IMAGE}
          imagePullPolicy: Always
          env:
            - name: API_ORIGIN
              value: http://api:8000
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
