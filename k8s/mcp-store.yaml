# mcp-store MCP server. ClusterIP only: agents call it inside the cluster.
# Store-scoped MCP tools; no backend signing, database or rail credentials.
# STORE_URL points at the in-cluster simulated merchant (services/store).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-store
  namespace: hackmidwest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-store
  template:
    metadata:
      labels:
        app: mcp-store
    spec:
      containers:
        - name: mcp-store
          image: ${MCP_STORE_IMAGE}
          imagePullPolicy: Always
          env:
            - name: STORE_MCP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: app-env
                  key: STORE_MCP_TOKEN
                  optional: true
            - name: STORE_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: app-env
                  key: STORE_API_TOKEN
                  optional: true
            - name: STORE_CHARGE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: app-env
                  key: STORE_CHARGE_TOKEN
                  optional: true
            - name: STORE_PUBLIC_URLS
              valueFrom:
                secretKeyRef:
                  name: app-env
                  key: STORE_PUBLIC_URLS
                  optional: true
            - name: MCP_ALLOWED_HOSTS
              valueFrom:
                secretKeyRef:
                  name: app-env
                  key: MCP_ALLOWED_HOSTS
                  optional: true
            - name: OBJ_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: app-env
                  key: OBJ_ENDPOINT
                  optional: true
            - name: OBJ_BUCKET
              valueFrom:
                secretKeyRef:
                  name: app-env
                  key: OBJ_BUCKET
                  optional: true
            - name: OBJ_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: app-env
                  key: OBJ_ACCESS_KEY
                  optional: true
            - name: OBJ_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: app-env
                  key: OBJ_SECRET_KEY
                  optional: true
            - name: OBJ_REGION
              valueFrom:
                secretKeyRef:
                  name: app-env
                  key: OBJ_REGION
                  optional: true
            - name: STORE_URL
              value: http://store:8000
            # Same as mcp-leash: browse/create must POST /execution/authorize.
            - name: API_URL
              value: http://api:8000
          ports:
            - containerPort: 8003
          readinessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-store
  namespace: hackmidwest
spec:
  type: ClusterIP
  selector:
    app: mcp-store
  ports:
    - name: http
      port: 8003
      targetPort: 8003
