# Strands agents service. ClusterIP only — called by api (and tools) inside the cluster.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: agents-trace-spool
  namespace: hackmidwest
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agents
  namespace: hackmidwest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agents
  template:
    metadata:
      labels:
        app: agents
    spec:
      containers:
        - name: agents
          image: ${AGENTS_IMAGE}
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: app-env
          env:
            - name: API_URL
              value: http://api:8000
            - name: AGENTS_URL
              value: http://agents:8000
            - name: MCP_LEASH_URL
              value: http://mcp-leash:8002/mcp
            - name: MCP_STORE_URL
              value: http://mcp-store:8003/mcp
            - name: TRACE_SPOOL_DIR
              value: /app/trace-spool
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: trace-spool
              mountPath: /app/trace-spool
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
      volumes:
        - name: trace-spool
          persistentVolumeClaim:
            claimName: agents-trace-spool
---
apiVersion: v1
kind: Service
metadata:
  name: agents
  namespace: hackmidwest
spec:
  type: ClusterIP
  selector:
    app: agents
  ports:
    - name: http
      port: 8000
      targetPort: 8000
