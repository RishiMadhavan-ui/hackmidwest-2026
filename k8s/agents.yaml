# Strands agents service. ClusterIP only — called by api (and tools) inside the cluster.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: agents-trace-spool
  namespace: hackmidwest
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agents
  namespace: hackmidwest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agents
  template:
    metadata:
      labels:
        app: agents
    spec:
      containers:
        - name: agents
          image: ${AGENTS_IMAGE}
          imagePullPolicy: Always
          env:
            - name: AGENTS_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: app-env
                  key: AGENTS_SERVICE_TOKEN
                  optional: true
            - name: AGENT_TOKEN_SHOPPER
              valueFrom:
                secretKeyRef:
                  name: app-env
                  key: AGENT_TOKEN_SHOPPER
                  optional: true
            - name: AGENT_TOKEN_SHOPPER_SCRIPTED
              valueFrom:
                secretKeyRef:
                  name: app-env
                  key: AGENT_TOKEN_SHOPPER_SCRIPTED
                  optional: true
            - name: STORE_MCP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: app-env
                  key: STORE_MCP_TOKEN
                  optional: true
            - name: OPENAI_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: app-env
                  key: OPENAI_BASE_URL
                  optional: true
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: app-env
                  key: OPENAI_API_KEY
                  optional: true
            - name: CHAT_MODEL
              valueFrom:
                secretKeyRef:
                  name: app-env
                  key: CHAT_MODEL
                  optional: true
            - name: INFERENCE_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: app-env
                  key: INFERENCE_BASE_URL
                  optional: true
            - name: INFERENCE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: app-env
                  key: INFERENCE_API_KEY
                  optional: true
            - name: MODEL_ID
              valueFrom:
                secretKeyRef:
                  name: app-env
                  key: MODEL_ID
                  optional: true
            - name: API_URL
              value: http://api:8000
            - name: AGENTS_URL
              value: http://agents:8000
            - name: MCP_LEASH_URL
              value: http://mcp-leash:8002/mcp
            - name: MCP_STORE_URL
              value: http://mcp-store:8003/mcp
            - name: TRACE_SPOOL_DIR
              value: /app/trace-spool
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: trace-spool
              mountPath: /app/trace-spool
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
      volumes:
        - name: trace-spool
          persistentVolumeClaim:
            claimName: agents-trace-spool
---
apiVersion: v1
kind: Service
metadata:
  name: agents
  namespace: hackmidwest
spec:
  type: ClusterIP
  selector:
    app: agents
  ports:
    - name: http
      port: 8000
      targetPort: 8000
