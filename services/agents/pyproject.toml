[project]
name = "leash-agents"
version = "0.1.0"
description = "Leash agents service: the shopper, the guardian, and the provenance plugin"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi[standard]>=0.115",
  "strands-agents[openai]>=1.0",
  "httpx>=0.27",
  "boto3>=1.35",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "respx>=0.21",
  "ruff>=0.6",
]

[tool.ruff]
# AGENTS.md asks for 2-space indentation. This lives here until a root
# pyproject.toml with the shared ruff config lands.
indent-width = 2
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
