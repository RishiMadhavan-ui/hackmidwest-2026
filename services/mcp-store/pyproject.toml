[project]
name = "mcp-store"
version = "0.1.0"
description = "mcp-store: MCP adapter for the controlled merchant (tools TBD)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "mcp>=1.10",
  "httpx>=0.27",
  "uvicorn>=0.30",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]

[tool.ruff]
indent-width = 2
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
