[project]
name = "leash-mcp-store"
version = "0.1.0"
description = "Store MCP server: store-only browsing with page evidence, checkout tools"
requires-python = ">=3.12,<3.13"
dependencies = [
  "mcp>=1.10",
  "httpx>=0.27",
  "uvicorn>=0.30",
  "boto3>=1.35",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "respx>=0.21",
  "ruff>=0.6",
]

[tool.ruff]
# AGENTS.md asks for 2-space indentation. This lives here until a root
# pyproject.toml with the shared ruff config lands.
indent-width = 2
line-length = 100
target-version = "py312"

[tool.ruff.lint.isort]
known-first-party = ["evidence"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
