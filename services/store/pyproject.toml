[project]
name = "leash-store"
version = "0.1.0"
description = "LEASH simulated merchant: Volt Supply Co. catalog and checkouts"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi[standard]>=0.115",
  "httpx>=0.27",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]

[tool.ruff]
indent-width = 2
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "../../shared"]
