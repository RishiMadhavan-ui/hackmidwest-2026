[project]
name = "leash-webhook"
version = "0.1.0"
description = "LEASH payment rail: pure decide(), Valkey grant store, local authorize"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi[standard]>=0.115",
  "redis>=5.0",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pyyaml>=6",
  "ruff>=0.6",
]

[tool.ruff]
indent-width = 2
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
